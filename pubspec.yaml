publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.6
  android_intent_plus: ^6.1.0
  url_launcher: ^6.3.1
  intl: ^0.20.2
  crypto: ^3.0.6
  package_info_plus: ^8.3.0
  path_provider: ^2.1.5
